.tech-canvas .tech-node{padding:4px 6px 3px;border-radius:8px;border-left-width:4px;gap:1px}
.tech-canvas .tech-node-name{font-size:.72rem;font-weight:800;line-height:1.1;min-height:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.tech-canvas .tech-node-meta{font-size:.57rem;max-width:85px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

.tech-canvas .tech-gem{height:10px;width:9px}

.tech-canvas .tech-reason{font-size:.5rem}
.tech-plan-note{font-size:.55rem;color:#677892}
.tech-node.planned{background:#f9fafc;color:#68768b;border-color:#d5dbe5}

  display:grid;grid-template-columns:minmax(185px,1fr) auto minmax(190px,1fr);

.shell-tree>.tree-overview{grid-column:3;grid-row:1;min-width:0;min-height:0;justify-content:flex-end;gap:4px}

.shell-tree .tech-range-label{display:none}

.shell-tree .tech-legend summary{list-style:none;white-space:nowrap;border:1px solid #c7d5e8;background:#fff;color:#546b8a;border-radius:7px;padding:4px 8px;cursor:pointer}

.shell-tree .tech-grade-overlay{background:linear-gradient(180deg,#fff2c8,#e7f5ff);border-bottom:2px solid #cfa75f;box-shadow:0 3px 7px #446c9444;flex-basis:49px;height:49px}
.shell-tree .tech-grade-strip{height:49px!important}.shell-tree .grade-fixed{height:49px}
.grade-fixed{border-right:1px solid #adcbe6!important;background:linear-gradient(90deg,#e1effcba,#fff8d5bb,#e3efffd1);border-bottom:1px solid #cfc69b!important;color:#2d5a9a;gap:0}
.grade-fixed strong{color:#204a8b;font-weight:900;text-shadow:0 1px white}.grade-fixed small{color:#527a89}.grade-fixed span{color:#ad8634!important;font-weight:900;letter-spacing:.1em}
.tech-canvas .era-band{background:linear-gradient(180deg,#ffffff22,#c2e8ff1f 35%,#c2f1ad1a 100%);border-right:2px dashed #8bb5d66d}
.tech-canvas .era-band.era-even{background:linear-gradient(180deg,#fff0ca15,#d5f5f71e 40%,#e2f1b91a)}
.tech-canvas .tech-node{background:linear-gradient(180deg,#fffef6 0%,#f9fcff 100%);border:1px solid #92b5dd;border-left:5px solid var(--track-color);border-bottom:3px solid #9fbfd4;box-shadow:0 3px 10px #317bad30,inset 0 1px #fff;transition:box-shadow .15s,filter .15s,transform .15s,opacity .15s;isolation:isolate;overflow:visible}
.tech-canvas .tech-node:hover{filter:saturate(1.2);transform:translateY(-2px);box-shadow:0 6px 17px #247ac54f,inset 0 1px #fff;z-index:5}
.tech-canvas .tech-node.master{background:linear-gradient(180deg,#fffbde,#fff4c6);border-color:#e2a92d;border-left:5px solid #f3c64d;border-bottom-color:#cd9424;box-shadow:0 3px 9px #ddaa2d55,inset 0 1px #fff}
.tech-canvas .tech-node.licensed{background:linear-gradient(180deg,#fffdfa,#edf7ff);border-color:#68aaed;border-left:5px solid #337ef2}
.tech-canvas .tech-node.open{background:linear-gradient(180deg,#fff,#ebf9ff);border-color:#8ed2f7;border-left:5px solid #2d8af3}
.tech-canvas .tech-node.locked{background:linear-gradient(180deg,#eff3f9,#e9eff4);border:1px solid #aebacd;border-left:5px solid #929fb7;filter:saturate(.63);opacity:.92}
.tech-canvas .tech-node.planned{background:linear-gradient(180deg,#fffef9,#f6f4f1);border:1px solid #c8c1b6;border-left:5px solid #aaa5b4;opacity:.89}
.tech-canvas .tech-node.selected{outline:3px solid #e8a523!important;outline-offset:1px;box-shadow:0 0 0 5px #ffe5a788,0 4px 15px #ecb24480}
.tech-canvas .tech-node.journey-node:not(.selected){box-shadow:0 0 0 2px #eeb544,0 4px 14px #b57b2945}
.tech-canvas .tech-node.journey-start{outline:2px dashed #24b884;outline-offset:3px}
.tech-canvas .tech-node-name{font-size:.85rem;color:#213d6d;font-weight:900}.tech-canvas .tech-node.locked .tech-node-name,.tech-canvas .tech-node.planned .tech-node-name{color:#6a7690}
.tech-canvas .tech-status{font-weight:900}.tech-canvas .tech-status.master{background:linear-gradient(180deg,#ffd967,#edaa2b);color:#744518;border:1px solid #e1ab3d}.tech-canvas .tech-status.open{background:#ddf5ff;color:#1467af}.tech-canvas .tech-status.planned{background:#f3f2f0;color:#7f7890}
.tech-node .tech-node-bottom{align-items:center}.tech-score{font-size:.53rem;font-weight:800;color:#6782a0;white-space:nowrap}.tech-plan-note{font-size:.65rem;color:#8d8193}

const COLUMN_W=324,MARGIN=12,NODE_W=242,NODE_H=78,ROW=108,TOP=22,HEADER_H=43,STAGE_PAD=19;
// Domain lanes stay at roughly the same Y coordinate across grades. Grade width
// grows only when its prerequisites have genuine within-grade depth.
const LANE_ORDER=['number','measure','geometry','algebra','functions','calculus','data','probability','discrete','modeling'];
const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const colors={number:'#597adc',algebra:'#9d64d0',geometry:'#d8884c',functions:'#288d93',data:'#4b958d',measure:'#9279be',probability:'#bc7ba7',calculus:'#bf685f',discrete:'#798c58',modeling:'#8f8180'};
const stageWorlds={E1:'はじまりの森',E2:'計算の丘',E3:'知恵の草原',E4:'学びの湖',E5:'挑戦の山',E6:'未来の塔',J1:'探究の谷',J2:'数式の城',J3:'発見の頂', 'H-I':'数学の書庫','H-A':'論理の庭','H-II':'関数の空','H-B':'探究の星','H-III':'極限の塔','H-C':'冒険の彼方'};

let zoom=1,manualZoom=false,lastPosition=null,observer=null,canvasLayout=null,mode='e1-3';
function makeLayout(skills,tracks=C.strands){
 const present=new Set(skills.map(s=>s.stage));
 const stages=C.stages.filter(s=>present.has(s.id)), visible=new Map(skills.map(s=>[s.id,s]));
 const positions={},links=[], stageGeometry=[],groups=new Map(),depthOf=new Map();
 const catalogIndex=new Map(C.skills.map((s,i)=>[s.id,i]));
 let colIndex=0,xStart=MARGIN;
 // All within-grade prerequisite chains run from left to right rather than
 // looping around a single column. This is a proper topological layering.
 for(const stage of stages){
  const nodes=skills.filter(s=>s.stage===stage.id),memo=new Map(),visiting=new Set();
  function localDepth(s){
   if(memo.has(s.id))return memo.get(s.id);
   if(visiting.has(s.id))throw Error('Cyclic prerequisite graph: '+s.id);
   visiting.add(s.id);
   const v=Math.max(0,...s.prereq.filter(id=>visible.has(id)&&visible.get(id).stage===stage.id).map(id=>localDepth(visible.get(id))+1));
   visiting.delete(s.id);memo.set(s.id,v);return v;
  }
  for(const s of nodes)localDepth(s);
  const nLayers=1+Math.max(...memo.values(),0),stageWidth=nLayers*COLUMN_W+STAGE_PAD*2;
  stageGeometry.push({id:stage.id,title:stage.title,group:stage.group,x:xStart,width:stageWidth,columns:nLayers});
  for(const s of nodes){
   const depth=memo.get(s.id),col=colIndex+depth;
   positions[s.id]={x:xStart+STAGE_PAD+depth*COLUMN_W,y:0,width:NODE_W,height:NODE_H,stage:s.stage,strand:s.strand,row:0,column:col};
   const key=col+':'+s.strand;
   if(!groups.has(key))groups.set(key,[]);
   groups.get(key).push(s);
  }
  xStart+=stageWidth;colIndex+=nLayers;
 }
 const columns=colIndex,laneBase=new Map(),laneSize=new Map();
 let slotCursor=0;
 for(const strand of LANE_ORDER){
  const peak=Math.max(0,...Array.from({length:columns},(_,col)=>(groups.get(col+':'+strand)||[]).length));
  if(!peak)continue;
  // Spare slots let different stages share a path without forcing a dense grid.
  const width=peak+Math.max(1,Math.ceil(peak*.25));
  laneBase.set(strand,slotCursor);laneSize.set(strand,width);
  slotCursor+=width+2;
 }
 const totalSlots=slotCursor;
 const columnGroups=[];
 for(let col=0;col<columns;col++)for(const strand of LANE_ORDER){
  const group=groups.get(col+':'+strand);
  if(group?.length)columnGroups.push({col,strand,nodes:group,base:laneBase.get(strand),width:laneSize.get(strand)});
 }
 const children=new Map(skills.map(s=>[s.id,[]]));
 for(const s of skills)for(const p of s.prereq)if(visible.has(p)){
  children.get(p).push(s.id);
  links.push({from:p,to:s.id,crossTrack:visible.get(p).strand!==s.strand});
 }
 function slotY(slot){return TOP+slot*ROW;}
 // Stable initial order followed by alternating upstream/downstream sweeps.
 // Unlike an independent list per grade, each pass aligns nodes with the
 // prerequisite/successor lanes on BOTH sides of the grade boundary.
 for(const g of columnGroups){
  g.nodes.sort((a,b)=>catalogIndex.get(a.id)-catalogIndex.get(b.id));
  g.nodes.forEach((s,i)=>{
   const slot=g.base+Math.round((i+1)*(g.width+1)/(g.nodes.length+1))-1;
   const pos=positions[s.id];pos.row=slot;pos.y=slotY(slot);
  });
 }
 function desired(s){
  const target=[],current=positions[s.id];
  for(const p of s.prereq){const pred=visible.get(p);if(!pred)continue;
   const weight=pred.strand===s.strand?4:0.65;
   target.push([positions[p].row,weight]);
  }
  for(const c of children.get(s.id)){const ch=visible.get(c);
   const weight=ch.strand===s.strand?3:0.5;
   target.push([positions[c].row,weight]);
  }
  target.push([current.row,1.25]);
  return target.reduce((a,[v,w])=>a+v*w,0)/target.reduce((a,[,w])=>a+w,0);
 }

  const sorted=g.nodes.map(s=>({s,target:desired(s)})).sort((a,b)=>a.target-b.target||catalogIndex.get(a.s.id)-catalogIndex.get(b.s.id));
  const m=sorted.length,n=g.width;
  // Increasing-slot DP gives the minimum total displacement with no overlaps.
  const dp=Array.from({length:m+1},()=>Array(n+1).fill(Infinity)),pick=Array.from({length:m+1},()=>Array(n+1).fill(false));
  for(let j=0;j<=n;j++)dp[0][j]=0;
  for(let i=1;i<=m;i++)for(let j=i;j<=n;j++){
   const slot=g.base+j-1,diff=sorted[i-1].target-slot;
   const use=dp[i-1][j-1]+diff*diff;
   if(use<=dp[i][j-1]){dp[i][j]=use;pick[i][j]=true;}else dp[i][j]=dp[i][j-1];
  }
  let j=n;for(let i=m;i>0;i--){while(!pick[i][j])j--;
   const pos=positions[sorted[i-1].s.id];pos.row=g.base+j-1;pos.y=slotY(pos.row);j--;
  }
 }
 for(let pass=0;pass<12;pass++){
  const ordered=pass%2?columnGroups.slice().reverse():columnGroups;
  for(const g of ordered)arrange(g);
 }

}
// Line-of-sight connections are truly straight. Only links blocked by an
// unrelated card use a two-gutter detour through the nearest empty row gap.
function segmentHitsRect(a,b,r){
 const eps=2.2,x0=r.x+eps,x1=r.x+r.width-eps,y0=r.y+eps,y1=r.y+r.height-eps;
 let t0=0,t1=1;const dx=b[0]-a[0],dy=b[1]-a[1];
 for(const [p,q] of [[-dx,a[0]-x0],[dx,x1-a[0]],[-dy,a[1]-y0],[dy,y1-a[1]]]){
  if(Math.abs(p)<1e-8){if(q<0)return false;continue;}
  const t=q/p;if(p<0){t0=Math.max(t0,t);}else t1=Math.min(t1,t);
  if(t0>t1)return false;

}
function routePoints(a,b,edgeNumber=0,obstacles=null){
 const source=[a.x+a.width,a.y+a.height/2],target=[b.x,b.y+b.height/2];
 if(!obstacles||!obstacles.some(r=>r!==a&&r!==b&&segmentHitsRect(source,target,r)))return[source,target];

 const right=target[0]-Math.min(39,(target[0]-source[0])*.34);
 // Every node is aligned to ROW; between rows there is a continuous corridor.
 const ideal=(source[1]+target[1])/2;
 const channelSlot=Math.max(0,Math.round((ideal-TOP-NODE_H-(ROW-NODE_H)/2)/ROW));

}
function path(a,b,edgeNumber=0,obstacles=null){return routePoints(a,b,edgeNumber,obstacles).map((v,i)=>`${i?'L':'M'} ${v[0].toFixed(1)} ${v[1].toFixed(1)}`).join(' ');}
function nodeBloom(metrics){

function scrollEl(){return typeof document!=='undefined'?document.getElementById('tech-map-scroll'):null;}
function memorize(){const el=scrollEl();if(el)lastPosition={left:el.scrollLeft,top:el.scrollTop,mode};}
function syncGrades(){const el=scrollEl(),strip=document.querySelector('.tech-grade-strip');if(el&&strip)strip.style.transform=`translate3d(${-el.scrollLeft}px,0,0)`;}
function setZoom(v){zoom=v;const canvas=document.querySelector('.tech-canvas'),strip=document.querySelector('.tech-grade-strip');if(canvas)canvas.style.zoom=zoom;if(strip&&canvasLayout){strip.style.width=`${canvasLayout.width*zoom}px`;strip.querySelectorAll('.grade-fixed').forEach((e,i)=>{e.style.left=`${canvasLayout.stageGeometry[i].x*zoom}px`;e.style.width=`${canvasLayout.stageGeometry[i].width*zoom}px`;});}const span=document.querySelector('.map-zoom-value');if(span)span.textContent=`${Math.round(zoom*100)}%`;syncGrades();}
function fit({resetPosition=true}={}){
 const el=scrollEl();if(!el||!canvasLayout)return;
 // Do not shrink all 285 nodes to fit the full height or width: this is a scrollable map.
 const stageCount=canvasLayout.stages.length;
 const best=stageCount<=3?Math.max(.86,Math.min(1.4,Math.floor(((el.clientWidth-16)/canvasLayout.width)*100)/100)):(el.clientWidth<700?.88:1);
 const previous={left:el.scrollLeft,top:el.scrollTop};setZoom(best);
 if(resetPosition){el.scrollLeft=0;el.scrollTop=0;}else{el.scrollLeft=previous.left;el.scrollTop=previous.top;}
 syncGrades();
}
function previewEdges(id){
 const journey=id?J.analyze(id,{catalog:C,statusOf:()=> 'open'}):null;
 const edgeSet=new Set(journey?journey.edges.map(e=>e.from+'>'+e.to):[]);
 document.querySelectorAll('.tech-link').forEach(link=>link.classList.toggle('hover',!!id&&edgeSet.has(link.dataset.source+'>'+link.dataset.target)));
}
function restore(selectedId){const el=scrollEl();if(!el)return;if(observer)observer.disconnect();el.addEventListener('scroll',syncGrades,{passive:true});
 el.addEventListener('pointerover',event=>{const button=event.target.closest?.('.tech-node');if(button)previewEdges(button.dataset.id);});
 el.addEventListener('pointerout',event=>{const button=event.target.closest?.('.tech-node');if(button&&!button.contains(event.relatedTarget))previewEdges(null);});if(!manualZoom)fit();if(lastPosition&&lastPosition.mode===mode){el.scrollLeft=lastPosition.left;el.scrollTop=lastPosition.top;}else if(selectedId&&selectedId!==C.visibleSkills(mode)[0]?.id)focus(selectedId);syncGrades();if(typeof ResizeObserver!=='undefined'){observer=new ResizeObserver(()=>{if(!manualZoom)fit({resetPosition:false});else syncGrades();});observer.observe(document.getElementById('tech-map-viewport'));}}

return{makeLayout,routePoints,render,memorize,restore,focus,adjustZoom,resetFit,resetRange,syncGrades};
});

function adventureLevel(){const xp=adventureXP(),level=Math.floor(xp/200)+1,part=xp%200;return {level,xp,part};}

function statusOf(id){return S.byId[id]?E.masteryStatus(id,state.records,state.recommendations):'planned';}
function summary(){const all=S.skills,master=all.filter(s=>statusOf(s.id)==='master').length,licenses=all.filter(s=>state.records[s.id]?.license).length,attempts=state.attemptsHistory.length;return{master,licenses,attempts};}
const head=()=>{const adv=adventureLevel(),sm=summary();return `<header class="topbar"><div class="brand" data-act="nav" data-value="tree"><div class="logo">✦</div><div><strong>MathStudio</strong><small>数学の冒険マップ</small></div></div>${state.profile?`<div class="adventure-rank" title="冒険EXPは実装済み技能の達成記録から計算した演出です。実力評価そのものではありません。"><span class="rank-label">冒険 Lv.${adv.level}</span><span class="rank-track"><span style="width:${adv.part/2}%"></span></span><span class="rank-number">${adv.part}/200 EXP</span></div><span class="top-master" title="教材実装済み技能のMASTER数">👑 ${sm.master}/${S.skills.length}</span>`:''}<div class="top-actions"><span class="pill">v0.1.8</span>${state.profile?'<button class="btn secondary small" data-act="export">記録を保存</button>':''}</div></header>`;};

function frame(content,isTree=false){document.documentElement.classList.toggle('math-tree-page',isTree);$('#app').innerHTML=`<div class="shell ${isTree?'shell-tree':''}">${head()}${saveError?'<div id="storage-warning" class="notice warn">端末への保存に失敗しました。データを書き出してください。</div>':''}${content}<div class="footer">MathStudio v0.1.8 • 通信不要 / 個人用 / 教材・基準は試験的な実装</div></div>`;}
function onboard(){const month=new Date().getMonth()+1;frame(`<div class="hero"><div class="kicker">WELCOME TO MATHSTUDIO</div><h1>数学のスキルツリーを冒険しよう。</h1><p>計算から文章題まで。4つの宝石をそろえて、次の技能をアンロック。</p></div><div class="grid2"><section class="card"><h2>まず、学年を教えてください</h2><p class="muted">学年と開始月を手掛かりに、できるところとこれから学ぶところを探します。</p><div class="field"><label for="grade">いまの学年</label><select id="grade">${Array.from({length:6},(_,i)=>`<option value="${i+1}" ${i===3?'selected':''}>小学${i+1}年生</option>`).join('')}</select></div><div class="field"><label for="month">初回診断の基準月</label><select id="month">${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${month===i+1?'selected':''}>${i+1}月</option>`).join('')}</select></div><button class="btn" data-act="begin">初回診断をはじめる →</button><p class="smallnote" style="margin-top:14px">初版で実際に出題できるのは小学1〜4年の基礎単元 ${S.skills.length}技能です。小学5・6年を選んでも、診断は実装済みの範囲で行います。</p></section><section class="card"><h2>学習のルール</h2><div class="stack"><div class="notice">🔹 基礎力・速度・応用力・文章題の4つを、混合テストで評価</div><div class="notice">🔓 全項目75%以上で次の技能を仮アンロック</div><div class="notice">🏅 1回のテストで全問正解・時間内。さらに前提技能もMASTERで紋章完成</div><div class="notice warn">⚠ 自宅PCのブラウザに記録を保存します。定期的にJSONでバックアップしてください。</div></div></section></div>`);}
function navBar(){return `<div class="nav"><button class="${state.nav==='tree'?'active':''}" data-act="nav" data-value="tree">🗺 冒険マップ</button><button class="${state.nav==='progress'?'active':''}" data-act="nav" data-value="progress">📈 学習の記録</button><button class="${state.nav==='settings'?'active':''}" data-act="nav" data-value="settings">⚙ 設定・バックアップ</button></div>`;}
function skillCard(s){let st=statusOf(s.id),rec=state.records[s.id];return `<button class="skill-card ${st}" data-act="select" data-id="${s.id}" aria-label="${esc(s.title)}"><div class="flex between"><span class="skill-grade">小${s.grade}年・${s.month}月目安</span><span class="status ${st}">${badge(st)[0]}</span></div><div class="skill-name">${esc(s.title)}</div><div class="flex between"><div>${displayMetric(rec?.metrics,true)}</div><div class="seal ${st==='master'?'master':st==='pending'?'pending':st==='licensed'?'license':''}">${st==='master'?'★':st==='pending'?'⌛':st==='licensed'?'◇':st==='locked'?'🔒':'✧'}</div></div><div class="skill-foot">${st==='locked'?'前提技能が必要':rec?.lastScore?'前回 '+rec.lastScore:'まだ受験していません'}</div></button>`;}
function routeGuide(id){
 const journey=J.analyze(id,{catalog:C,statusOf,playableIds});
 const statusLabel={master:'👑 MASTER',licensed:'💎 仮免',pending:'✦ 自身は満点',open:'🔵 挑戦可能',locked:'🔒 未解放',planned:'📜 教材準備中'};
 const stepItem=skillId=>{const sk=C.byId[skillId],st=statusOf(skillId);return `<button type="button" class="path-skill ${st}" data-act="jump-skill" data-id="${esc(skillId)}" title="この技能をマップで開く"><span class="path-skill-state">${st==='master'?'✓':J.met(st)?'◇':st==='planned'?'📜':st==='locked'?'🔒':'●'}</span><span class="path-skill-title">${esc(sk.title)}</span><small>${esc(C.stageById[sk.stage]?.title||'')} · ${statusLabel[st]||st}</small></button>`;};
 const starts=journey.firstSteps;
 const next=journey.availableActual;
 const firstSection=journey.remaining.length?`<div class="journey-next"><h4>🧭 いま戻るべきスタート地点</h4><p>前提を順にさかのぼり、まだ達成していない技能のうち、その前の条件がそろっているものを表示します。</p><div class="route-chips">${starts.slice(0,8).map(stepItem).join('')||'<span class="muted">前提を確認してください。</span>'}</div>${starts.length>8?`<small>ほか ${starts.length-8} 技能は下の全経路に表示</small>`:''}${next.length?`<div class="journey-available"><b>⚔ 現在の教材で挑戦できる技能（${next.length}件）</b><div class="route-chips">${next.slice(0,5).map(stepItem).join('')}</div><small>こちらは実装済み${S.skills.length}技能のアンロック判定に基づきます。上の最初の一歩は全${C.skills.length}技能の計画上の順序です。</small></div>`:'<div class="notice warn">このルート上の未達技能は、まだ教材を実装していないか、アンロック前です。教材未実装の技能は挑戦できません。</div>'}</div>`:`<div class="notice good">前提技能は仮免以上になっています。${statusOf(id)==='planned'?'ただし、この目標技能の教材は未実装です。':'この目標技能に挑戦する条件がそろっています。'}</div>`;
 const layerRows=journey.layers.map((ids,index)=>`<div class="route-layer"><span class="route-layer-title">${index===0?'はじまり':`第${index+1}段階`}</span><div class="route-chips">${ids.map(stepItem).join('')}</div></div>`).join('');
 return `<section class="journey-guide" aria-label="すべての前提技能"><div class="journey-heading"><h3>🗺 この技能までの全ルート</h3><span class="route-total">${journey.pathCount}技能・${journey.edgeCount}本のつながり</span></div><p class="smallnote">直接の前提だけでなく、そのさらに前まで、枝分かれする全経路を表示します。全ルートはツリー上でも金色に強調されます。</p><div class="journey-counts"><span>✓ 条件達成 <b>${journey.completed.length}</b></span><span>◇ これから <b>${journey.remaining.length}</b></span><span>📜 教材準備中 <b>${journey.blockedPlanned.length}</b></span></div>${firstSection}${journey.pathCount?`<details class="journey-all" open><summary>すべての前提技能を、最初から順に見る（${journey.pathCount}件）</summary><div class="route-layers">${layerRows}</div></details>`:'<p class="notice">前提技能なし。この技能がスタート地点です。</p>'}<p class="smallnote">※前提のつながりは${C.skills.length}技能の試作カリキュラム案です。実際のアンロック・MASTER判定は、出題可能な${S.skills.length}技能の学習エンジンで行います。仮免とMASTERは異なり、完全MASTERには前提もMASTERが必要です。</p></section>`;
}
function detail(id){
 const s=C.byId[id];if(!s)return'';
 const actual=S.byId[id],playable=!!actual,st=statusOf(id),rec=state.records[id]||{},stage=C.stageById[s.stage];
 const full=playable?`<div class="emblem-panel"><div class="emblem-caption">4つの力を集めて花を咲かせよう</div>${displayMetric(rec.metrics)}</div><p class="smallnote">数字は直近の正式テストの達成率です。MASTER認定には同じテストで全問正解・時間内、さらに前提技能もMASTERが必要です。</p>`:'<div class="notice warn"><strong>📜 教材準備中</strong>：前提関係は見られますが、この技能の問題・採点・マスター認定は未実装です。</div>';
 const actions=playable?`<div class="challenge-actions"><button class="btn soft" data-act="practice" data-id="${esc(id)}" ${st==='locked'?'disabled':''}>📖 短い練習</button><button class="btn quest-primary" data-act="test" data-id="${esc(id)}" ${st==='locked'?'disabled':''}>⚔ ${st==='master'?'もう一度挑戦':'マスターテストに挑戦'}</button></div><p class="hint">混合テストは目安20〜30分。全問正解が完全マスターの条件です。</p>`:'<p class="smallnote">教材が追加されたら練習・テストへ挑戦できます。</p>';
 return `<section class="card skill-detail"><div class="flex between"><div><div class="kicker">${esc(stage?.title||s.stage)} / ${esc(C.strands.find(t=>t.id===s.strand)?.title||s.strand)}</div><h2 id="skill-dialog-title">${esc(actual?.title||s.title)}</h2></div><div class="seal ${st==='master'?'master':st==='pending'?'pending':st==='licensed'?'license':''}">${st==='master'?'👑':st==='planned'?'📜':'✧'}</div></div><span class="status ${st}">${st==='planned'?'教材準備中':badge(st)[0]}</span><p class="smallnote">${esc(s.area)}</p>${full}${st==='pending'?'<div class="notice warn">自分のテストは満点です。前提技能のMASTERを待っています。</div>':''}${state.recommendations.includes(id)?'<div class="notice">初回診断でおすすめされた技能です。</div>':''}${st==='locked'?'<div class="notice warn">未解放です。下の全ルートで、どの技能から始めればよいか確認できます。</div>':''}${routeGuide(id)}${actions}</section>`;
}

function tree(showDialog=false){
 const sum=summary(),M=window.MathTechTree;
 const range=state.treeRange||(state.selectedId&&C.byId[state.selectedId]?C.modeForSkill(state.selectedId):(Number(state.profile?.grade)||1)<=3?'e1-3':'e4-6');
 const visible=C.visibleSkills(range);
 const rec=state.selectedId&&visible.some(s=>s.id===state.selectedId)?state.selectedId:(state.recommendations.find(id=>visible.some(s=>s.id===id))||visible[0]?.id);
 if(document.getElementById('tech-map-scroll'))M.memorize();
 frame(`<div class="tree-overview"><div class="flex" style="align-items:baseline;gap:4px"><h1>数学の技術ツリー</h1><span class="tree-subtitle">学年別・分岐と合流のスキルマップ</span></div><div class="tree-summary"><span class="pill">全${C.skills.length}技能</span><span class="pill">★ MASTER ${sum.master}/${S.skills.length}（教材あり）</span><span class="pill">◇ 仮免 ${sum.licenses}</span><span class="pill">受験 ${sum.attempts}</span><button class="btn secondary small" data-act="diagnosis">診断をやり直す</button></div></div>${navBar()}${M.render({skills:visible,tracks:C.strands,statusOf,records:state.records,selectedId:rec,recommendations:state.recommendations,activeRange:range,routeMode})}<dialog id="skill-dialog" class="skill-dialog" aria-labelledby="skill-dialog-title"><div class="skill-dialog-titlebar"><span>◆ 技能の詳細と挑戦</span><button class="skill-dialog-close" type="button" data-act="close-skill" aria-label="閉じる">✕</button></div>${detail(rec)}</dialog>`,true);
 M.restore(rec);
 if(showDialog){const dialog=$('#skill-dialog');dialog?.showModal();dialog?.querySelector('.skill-dialog-close')?.focus({preventScroll:true});}
}
function openSkill(id){if(!C.byId[id])return;routeMode=true;state.selectedId=id;state.treeRange=C.modeForSkill(id);window.MathTechTree.resetRange();save();tree(true);}
function searchSkills(){
 const q=$('#tech-search')?.value.trim().toLocaleLowerCase('ja')||'',host=$('#tech-search-results');if(!host)return;
 if(!q){host.innerHTML='<div class="search-message">技能名または領域の文字を入力してください。</div>';host.hidden=false;return;}
 const results=C.skills.filter(s=>(s.title+' '+s.id+' '+s.area+' '+C.stageById[s.stage]?.title).toLocaleLowerCase('ja').includes(q));
 host.innerHTML=`<div class="search-message">${results.length}件ヒット${results.length>30?'（先頭30件を表示）':''}</div>`+results.slice(0,30).map(s=>`<button type="button" data-act="map-search-go" data-id="${esc(s.id)}">${esc(C.stageById[s.stage]?.title)}：${esc(s.title)}${S.byId[s.id]?' （問題あり）':''}</button>`).join('');host.hidden=false;
}

function diagnose(){let d=state.diagnosis;if(!d){state.diagnosis=E.makeDiagnosis(state.profile);d=state.diagnosis;save();}
 if(d.index>=d.steps.length){finishDiagnosis();return;}
 const q=d.question||E.nextDiagnosticQuestion(d);save();const s=S.byId[q.skillId],step=d.steps[d.index];
 frame(`<div class="page-title"><div><div class="kicker">INITIAL ASSESSMENT</div><h1>得意なところを探そう</h1><div class="subtitle">今の問題ができたら少し先へ。難しければ前の技能へ。</div></div><button class="btn secondary small" data-act="nav" data-value="tree">診断を終了してツリーへ</button></div><section class="card" style="max-width:780px;margin:auto"><div class="diag-dots">${S.tracks.map((t,i)=>`<span class="${i<d.index?'done':i===d.index?'active':''}">${t.icon} ${t.title}</span>`).join('')}</div><div class="divider"></div><div class="flex between"><span class="tag">小${s.grade}年・${esc(s.title)}</span><span class="counter">この技能の確認 ${step.probes+1} / 3</span></div><div class="question"><p>${esc(q.prompt)}</p></div><div class="field"><label for="diag-answer">答えを入力</label><input id="diag-answer" class="answer-input" type="text" inputmode="decimal" autocomplete="off" placeholder="例：12 または 2/3"></div><div class="flex between"><span class="hint">数問の結果から位置を推定します。マスター認定ではありません。</span><button class="btn" data-act="diagnose-answer">次の問題へ →</button></div></section>`);$('#diag-answer')?.focus();}
function finishDiagnosis(){const d=state.diagnosis;if(!d)return;const ids=d.steps.map(x=>x.recommendSkillId).filter(Boolean);state.recommendations=[...new Set(ids)];state.selectedId=ids[0]||S.skills[0].id;const summary=d.steps.map(x=>({track:x.track,skillId:x.recommendSkillId,levelsChecked:x.levelsChecked}));state.diagnosis=null;state.lastDiagnosis={at:new Date().toISOString(),summary,logs:d.logs};state.nav='tree';save();render();}
function startTest(id){let s=S.byId[id];if(!s||statusOf(id)==='locked')return;
 state.active={test:E.buildTest(s),answers:[],index:0,paused:false,elapsedBase:0,startedAt:ms()};state.lastResult=null;save();render();}
function startPractice(id){const skill=S.byId[id];if(!skill||statusOf(id)==='locked')return;const categories=['basic','application','word','basic','application','word','basic','application','word'];const questions=categories.map(cat=>E.makeQuestion(skill,cat));state.practice={skillId:id,questions,answers:[],checks:[],index:0,finished:false};state.lastResult=null;save();render();}
function practiceScreen(){const p=state.practice,q=p.questions[p.index],res=p.checks[p.index],cat={basic:'基礎',application:'応用',word:'文章題'}[q.category];
frame(`<div class="page-title"><div><div class="kicker">TRAINING</div><h1>${esc(S.byId[p.skillId].title)} の練習</h1><div class="subtitle">練習中の間違いはマスター判定に影響しません。</div></div><button class="btn secondary small" data-act="stop-practice">練習を終える</button></div><section class="card" style="max-width:800px;margin:auto"><div class="flex between"><span class="tag">${cat}</span><span class="counter">練習 ${p.index+1} / ${p.questions.length}</span></div><div class="question"><p>${esc(q.prompt)}</p></div><div class="field"><label for="practice-answer">${q.inputMode==='formula'?'式を入力（答えだけでは判定できません）':q.category==='word'?'答え（この問題は最終結果を採点）':'答え'}</label>${q.inputMode==='formula'?`<textarea id="practice-answer" class="answer-input formula" rows="3" ${res?'disabled':''}>${esc(p.answers[p.index]||'')}</textarea>`:`<input id="practice-answer" class="answer-input" type="text" inputmode="decimal" value="${esc(p.answers[p.index]||'')}" ${res?'disabled':''}>`}</div>${res?`<div class="notice ${res.status==='correct'?'good':'warn'}">${res.status==='correct'?'○ 正解！':res.status==='needs_review'?'△ 要確認':'× もう一度確認しよう'}<br>${esc(res.detail)}<br>確認用の答え：${esc(q.displayAnswer)}</div><p class="hint" style="margin-top:12px">${esc(q.hint)} 練習では答えを確認できます。正式テストでは別の問題が出ます。</p><button class="btn" data-act="practice-next" style="margin-top:16px">${p.index===p.questions.length-1?'練習を終える':'次の練習問題へ →'}</button>`:`<button class="btn" data-act="practice-check">答え合わせ</button>`}</section>`);}
function endPractice(){const p=state.practice;if(!p)return;state.practiceHistory=(state.practiceHistory||[]);state.practiceHistory.push({at:new Date().toISOString(),skillId:p.skillId,questions:p.questions,answers:p.answers,checks:p.checks});state.practice=null;save();render();}
function testScreen(){const a=state.active;if(!a)return;let q=a.test.questions[a.index],cat={basic:'基礎',application:'応用',word:'文章題'}[q.category];let remaining=a.test.targetSeconds-elapsed();frame(`<div class="page-title"><div><div class="kicker">MASTERY EXAM</div><h1>${esc(S.byId[a.test.skillId].title)}</h1><div class="subtitle">各分野を混ぜた1回のテスト。全問正解＋目標時間以内で完全達成。</div></div><div class="flex"><span class="timer" id="timer">${clock(elapsed())} / ${clock(a.test.targetSeconds)}</span><button class="btn secondary small" data-act="pause">${a.paused?'再開':'一時停止'}</button></div></div>${a.paused?'<div class="notice warn">一時停止中です。再開すると解答できます。</div>':''}<section class="card" style="max-width:880px;margin:auto"><div class="flex between"><span class="tag">${cat}</span><span class="counter">問題 ${a.index+1} / ${a.test.questions.length}</span></div><div class="question"><p>${esc(q.prompt)}</p></div><div class="field"><label for="test-answer">${q.inputMode==='formula'?'式を入力（複数行も可）':q.category==='word'?'答えを入力（結果のみ採点）':'答えを入力'}</label>${q.inputMode==='formula'?`<textarea id="test-answer" class="answer-input formula" rows="3" ${a.paused?'disabled':''} placeholder="例：24×3÷8=9\nまたは\n24×3=72\n72÷8=9">${esc(a.answers[a.index]||'')}</textarea>`:`<input id="test-answer" class="answer-input" type="text" inputmode="decimal" autocomplete="off" value="${esc(a.answers[a.index]||'')}" ${a.paused?'disabled':''} placeholder="数値 または 2/3 のような分数">`}</div><div class="hint">${q.inputMode==='formula'?'答えの数値だけでは立式を確認できません。途中式と最終結果を記入してください。':'数字・小数・分数で答えられます。'}</div><div class="qnav">${a.test.questions.map((v,i)=>`<button aria-label="問題${i+1}" data-act="jump" data-value="${i}" class="${i===a.index?'current':a.answers[i]?.trim()?'filled':''}">${i+1}</button>`).join('')}</div><div class="flex between" style="flex-wrap:wrap"><button class="btn secondary" data-act="prev" ${a.index===0?'disabled':''}>← 前の問題</button><div class="flex"><button class="btn secondary" data-act="next" ${a.index===a.test.questions.length-1?'disabled':''}>次の問題 →</button><button class="btn" data-act="submit">採点する</button></div></div><div class="divider"></div><div class="notice warn">マスターには全問正解が必要です。未回答や自動判定できない式は正解として扱いません。目標時間を超えても解答は続けられます。</div></section>`);
}
function submit(){const a=state.active;if(!a)return;const blanks=a.test.questions.filter((_,i)=>!String(a.answers[i]||'').trim()).length;if(blanks&&!confirm(`${blanks}問が未回答です。そのまま採点しますか？`))return;
 if(!a.paused){a.elapsedBase=elapsed();a.paused=true;a.startedAt=null;}
 const beforeLevel=adventureLevel().level;
 const result=E.gradeTest(a.test,a.answers,a.elapsedBase),rec=E.applyResult(state.records,a.test.skillId,result,a.elapsedBase,a.test.createdAt);
 const row={at:new Date().toISOString(),skillId:a.test.skillId,test:a.test,answers:a.answers,results:result.results,metrics:result.metrics,elapsedSeconds:a.elapsedBase,perfect:result.perfect,provisional:result.provisional,correct:result.correct,count:result.count};
 state.attemptsHistory.push(row);state.lastResult={...row,recMaster:rec.master,adventureLevelUp:adventureLevel().level>beforeLevel};state.active=null;state.selectedId=row.skillId;state.nav='tree';save();render();}
function resultScreen(){const r=state.lastResult;if(!r)return tree();const s=S.byId[r.skillId],st=statusOf(r.skillId),target=r.test.targetSeconds;
 const desc=r.perfect?st==='master'?'完全マスター！4つの宝石が合体しました。':'全問正解・時間達成！前提技能の完全マスター待ちです。':r.provisional?'全4項目が75%以上。次の技能に挑戦できます。':'まだ仮免には届いていません。間違えたところを確かめましょう。';
 frame(`<div class="page-title"><div><div class="kicker">EXAM RESULT</div><h1>${esc(s.title)} ― 採点結果</h1></div><button class="btn secondary" data-act="close-result">スキルツリーに戻る</button></div><div class="grid2"><section class="card">${r.adventureLevelUp?`<div class="notice good" style="font-weight:900;font-size:1.1rem">🎉 冒険レベルアップ！ Lv.${adventureLevel().level} になりました！</div>`:''}<div class="result-celebration">${petalBloom(r.metrics)}<div><h2>${r.perfect?'🏆 挑戦成功！':r.provisional?'🔓 仮免到達！':'📝 次の挑戦に備えよう'}</h2><p>${desc}</p></div></div><div class="statgrid"><div class="stat"><strong>${r.correct}/${r.count}</strong><small>正解数</small></div><div class="stat"><strong>${clock(r.elapsedSeconds)}</strong><small>実際の時間</small></div><div class="stat"><strong>${clock(target)}</strong><small>目標時間</small></div></div><div class="divider"></div>${metrics.map(([k,label,col])=>`<div class="metricrow"><b>${label}</b><div class="progress"><div style="width:${r.metrics[k]}%;background:${col}"></div></div><b>${r.metrics[k]}%</b></div>`).join('')}<div class="notice" style="margin-top:12px">基本・応用・文章題はそれぞれの正答率。速度は目標時間と実時間だけで評価します。完全マスターには全問正解＋時間内の両方が必要です。</div><div class="flex" style="margin-top:18px;flex-wrap:wrap"><button class="btn" data-act="retry" data-id="${r.skillId}">新しい問題で再挑戦</button><button class="btn secondary" data-act="gemini">Geminiへの質問を用意</button></div></section><section class="card"><h2>解答の振り返り</h2><p class="muted">今回の問題・あなたの解答・判定を記録しています。</p><div style="max-height:590px;overflow:auto">${r.test.questions.map((q,i)=>{let res=r.results[i],good=res.status==='correct';return `<div class="result-line ${good?'ok':res.status==='needs_review'?'review':'bad'}"><div class="flex between"><b>${i+1}. ${good?'○ 正解':res.status==='needs_review'?'△ 要確認':'× 不正解'}</b><span class="tag">${{basic:'基礎',application:'応用',word:'文章題'}[q.category]}</span></div><div class="result-prompt">${esc(q.prompt)}</div><div class="result-detail">解答：${esc(r.answers[i]||'（未回答）').replace(/\n/g,' / ')}<br>確認用の答え：${esc(q.displayAnswer)}<br>${esc(res.detail)}</div></div>`;}).join('')}</div></section></div>`);
}
function progress(){const sum=summary(),hist=state.attemptsHistory;const W=700,H=230,pad=38;
 const shadow={};
 const counts=hist.map((h,i)=>{
   if(!shadow[h.skillId])shadow[h.skillId]={};
   if(h.provisional)shadow[h.skillId].license=true;
   if(h.perfect){shadow[h.skillId].selfMaster=true;shadow[h.skillId].license=true;}
   E.recalc(shadow);
   return {a:i+1,b:S.skills.filter(sk=>shadow[sk.id]?.license).length,c:S.skills.filter(sk=>shadow[sk.id]?.master).length};
 });
 const maxY=Math.max(15,...counts.map(o=>Math.max(o.b,o.c)));
 const point=(name)=>counts.map((o,i)=>`${pad+(i/Math.max(1,counts.length-1))*(W-2*pad)},${H-pad-o[name]/maxY*(H-2*pad)}`).join(' ');
 frame(`<div class="page-title"><div><div class="kicker">LEARNING HISTORY</div><h1>学習の記録</h1></div></div>${navBar()}<div class="grid2"><section class="card"><h2>試作版の学習推移</h2>${hist.length?`<svg class="history-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="受験回数ごとの仮免技能数とマスター技能数"><line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#cdd8e7"/><line x1="${pad}" y1="${pad}" x2="${pad}" y2="${H-pad}" stroke="#cdd8e7"/><polyline fill="none" stroke="#4a74ce" stroke-width="3" points="${point('b')}"/><polyline fill="none" stroke="#19a279" stroke-width="3" points="${point('c')}"/><text x="${pad}" y="20" font-size="13" fill="#677b99">技能数 0〜${maxY}</text></svg><div class="flex" style="flex-wrap:wrap"><span class="pill">🔵 仮免を獲得した技能</span><span class="pill">🟢 現在MASTERの技能</span></div>`:'<div class="notice">受験履歴がありません。混合テストを受けると記録されます。</div>'}<div class="notice warn" style="margin-top:16px">学校の標準進度比較・将来予測は未実装です。公的な月別進度や難易度の校正後に追加します。</div></section><section class="card"><h2>記録の概要</h2><div class="statgrid"><div class="stat"><strong>${sum.master}</strong><small>MASTER</small></div><div class="stat"><strong>${sum.licenses}</strong><small>仮免</small></div><div class="stat"><strong>${sum.attempts}</strong><small>正式テスト</small></div></div><div class="divider"></div><h3>最近の受験</h3>${hist.slice(-10).reverse().map(h=>`<div class="result-line"><div class="flex between"><b>${esc(S.byId[h.skillId]?.title||'技能')}</b><span class="status ${h.perfect?'master':h.provisional?'licensed':''}">${h.perfect?'満点':h.provisional?'仮免':'練習継続'}</span></div><div class="hint">${esc(h.at.slice(0,16).replace('T',' '))} / ${h.correct}/${h.count} 正解 / ${clock(h.elapsedSeconds)}</div></div>`).join('')||'<p class="muted">記録なし</p>'}</section></div>`);
}
function settings(){frame(`<div class="page-title"><div><div class="kicker">SETTINGS</div><h1>設定・バックアップ</h1></div></div>${navBar()}<div class="grid2"><section class="card"><h2>学習データの保存</h2><p>名前やアカウントを使わず、このブラウザ内に保存します。ブラウザのデータを消すと記録も消える場合があるため、こまめにJSONファイルを書き出してください。</p><div class="stack"><button class="btn" data-act="export">JSONバックアップを保存</button><button class="btn secondary" data-act="import">JSONバックアップを読み込む</button><input type="file" id="import-file" accept=".json,application/json" style="display:none"><button class="btn secondary" data-act="diagnosis">初回診断をやり直す</button></div><p class="smallnote">JSONに問題文・解答・正誤・所要時間が保存されます。共有する前に内容を確認してください。</p></section><section class="card"><h2>現在の対象範囲</h2><p>問題生成・採点できるのは小学1〜4年の基礎単元 ${S.skills.length}技能です。小学校から高校まで${C.skills.length}技能の参照ツリーをアプリに表示しています。ただし、残り${C.skills.length-S.skills.length}技能は教材準備中です。</p><div class="notice warn">文章題の数式判定は四則演算中心の限定実装です。数値が合っていても式を検証できなければ「要確認」となり、マスターにはなりません。</div><div class="divider"></div><button class="btn danger small" data-act="reset">端末内の学習データを初期化</button></section></div>`);}
function render(){if(!state.profile)return onboard();if(state.active)return testScreen();if(state.practice)return practiceScreen();if(state.diagnosis)return diagnose();if(state.lastResult)return resultScreen();if(state.nav==='progress')return progress();if(state.nav==='settings')return settings();tree();}
function changePage(page){routeMode=false;state.nav=page;state.lastResult=null;state.active=null;state.practice=null;state.diagnosis=null;save();render();}
function exportData(){const payload={...state,exportedAt:new Date().toISOString()};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});const link=document.createElement('a');const url=URL.createObjectURL(blob);link.href=url;link.download=`MathStudio_backup_${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);}
function sanitizeImport(data){if(!data||data.schema_version!==1||typeof data.profile!=='object'||!data.profile)throw Error('非対応のバックアップ形式です');const out=fresh();const grade=Number(data.profile.grade),month=Number(data.profile.month);if(!(grade>=1&&grade<=6&&month>=1&&month<=12))throw Error('学年・月のデータが不正です');out.profile={grade,month};if(data.records&&typeof data.records==='object'){for(const sk of S.skills){const rec=data.records[sk.id];if(rec&&typeof rec==='object'){out.records[sk.id]={license:rec.license===true,selfMaster:rec.selfMaster===true,metrics:Object.fromEntries(metrics.map(([k])=>[k,Math.min(100,Math.max(0,Number(rec.metrics?.[k])||0))])),attempts:Math.min(100000,Math.max(0,Number(rec.attempts)||0)),history:Array.isArray(rec.history)?rec.history.slice(-2000):[]};}}}out.recommendations=Array.isArray(data.recommendations)?data.recommendations.filter(id=>!!S.byId[id]):[];out.selectedId=S.byId[data.selectedId]?data.selectedId:null;
 out.attemptsHistory=Array.isArray(data.attemptsHistory)?data.attemptsHistory.slice(0,10000).filter(x=>S.byId[x?.skillId]&&Array.isArray(x.test?.questions)&&Array.isArray(x.answers)&&Array.isArray(x.results)):[];out.practiceHistory=Array.isArray(data.practiceHistory)?data.practiceHistory.filter(x=>S.byId[x?.skillId]&&Array.isArray(x.questions)&&Array.isArray(x.answers)):[];
 out.lastDiagnosis=data.lastDiagnosis&&typeof data.lastDiagnosis==='object'?data.lastDiagnosis:null;E.repairStoredGrades(out);out.gradingRevision=2;E.recalc(out.records);return out;}
async function importData(f){if(!f||f.size>8*1024*1024){alert('8MB以下のJSONファイルを選んでください');return;}try{const obj=JSON.parse(await f.text());const imported=sanitizeImport(obj);if(!confirm('端末内の学習記録を、このバックアップで置き換えます。よろしいですか？'))return;state=imported;save();render();}catch(e){alert('読み込み失敗：'+e.message);}}
function gemini(){const r=state.lastResult;if(!r)return;const misses=r.test.questions.map((q,i)=>({q,res:r.results[i],answer:r.answers[i]})).filter(x=>x.res.status!=='correct').slice(0,3);const prompt=`小学生の算数の家庭教師として、答えをすぐ教えず質問を1つずつ出して考え方を導いてください。氏名等の個人情報はありません。\n単元：${S.byId[r.skillId]?.title}\n${misses.length?misses.map(x=>`問題：${x.q.prompt}\n子どもの解答：${x.answer||'（無回答）'}\n判定：${x.res.detail}`).join('\n'): '満点でした。関連する発展問題を1つだけ作り、段階的にヒントをください。'}`;
 const opened=window.open('https://gemini.google.com/app','_blank','noopener,noreferrer');
 if(navigator.clipboard?.writeText)navigator.clipboard.writeText(prompt).then(()=>{alert('質問文をコピーしました。Geminiの画面に貼り付けてください。');}).catch(()=>fallbackCopy(prompt));else fallbackCopy(prompt);
 if(!opened)alert('Geminiの別タブを開けませんでした。ブラウザで gemini.google.com/app を開いてください。');}
function fallbackCopy(t){let el=document.createElement('textarea');el.value=t;el.style.position='fixed';el.style.top='0';document.body.appendChild(el);el.select();try{document.execCommand('copy');alert('質問文をコピーしました。Geminiに貼り付けてください。');}catch{alert('コピーできませんでした。');}el.remove();}
// Event delegation; active text inputs are saved on every keystroke.
document.addEventListener('input',e=>{if(e.target.id==='test-answer'&&state.active){state.active.answers[state.active.index]=e.target.value;save();}if(e.target.id==='practice-answer'&&state.practice){state.practice.answers[state.practice.index]=e.target.value;save();}});
document.addEventListener('change',e=>{if(e.target.id==='import-file')importData(e.target.files?.[0]);if(e.target.id==='tech-range'){routeMode=false;state.treeRange=e.target.value;window.MathTechTree.resetRange();save();tree();}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='tech-search'){e.preventDefault();searchSkills();return;}if(e.key==='Enter'&&e.target.id==='diag-answer'){e.preventDefault();$('#app [data-act="diagnose-answer"]')?.click();}});
document.addEventListener('click',e=>{const btn=e.target.closest('[data-act]');if(!btn||btn.disabled)return;const act=btn.dataset.act,id=btn.dataset.id;
 if(act==='begin'){state=fresh();state.profile={grade:Number($('#grade').value),month:Number($('#month').value)};state.diagnosis=E.makeDiagnosis(state.profile);save();return render();}
 if(act==='nav')return changePage(btn.dataset.value);
 if(act==='map-fit')return window.MathTechTree.resetFit();
 if(act==='map-route'){routeMode=!routeMode;window.MathTechTree.memorize();return tree();}
 if(act==='map-focus')return window.MathTechTree.focus(state.selectedId||state.recommendations[0]||S.skills[0].id);
 if(act==='map-zoom-in')return window.MathTechTree.adjustZoom(.1,state.selectedId||state.recommendations[0]||S.skills[0].id);
 if(act==='map-zoom-out')return window.MathTechTree.adjustZoom(-.1,state.selectedId||state.recommendations[0]||S.skills[0].id);
 if(act==='map-search'){searchSkills();return;}
 if(act==='map-search-go'||act==='jump-skill'){return openSkill(id);}
 if(act==='select'){routeMode=true;state.selectedId=id;save();return tree(true);}
 if(act==='close-skill'){const dlg=$('#skill-dialog');if(dlg?.open)dlg.close();document.querySelector(`.tech-node[data-id="${state.selectedId}"]`)?.focus({preventScroll:true});return;}
 if(act==='test'||act==='retry')return startTest(id);
 if(act==='practice')return startPractice(id);
 if(act==='stop-practice')return endPractice();
 if(act==='practice-check'){const p=state.practice;if(!p)return;const answer=p.answers[p.index]||'';p.checks[p.index]=E.scoreAnswer(p.questions[p.index],answer);save();return render();}
 if(act==='practice-next'){const p=state.practice;if(!p)return;if(p.index===p.questions.length-1)return endPractice();p.index++;save();return render();}
 if(act==='diagnosis'){if(!confirm('初回診断を最初からやり直します。取得済みの宝石は保持します。よろしいですか？'))return;state.lastResult=null;state.active=null;state.practice=null;state.diagnosis=E.makeDiagnosis(state.profile);save();return render();}
 if(act==='diagnose-answer'){let ans=$('#diag-answer')?.value?.trim();if(!ans){alert('答えを入力してください');return;}const step=E.diagnoseAnswer(state.diagnosis,ans);save();return step.done?finishDiagnosis():render();}
 if(act==='pause'){let a=state.active;if(a.paused){a.paused=false;a.startedAt=ms();}else{a.elapsedBase=elapsed();a.paused=true;a.startedAt=null;}save();return render();}
 if(act==='prev'||act==='next'||act==='jump'){let a=state.active;if(!a)return;a.index=act==='prev'?Math.max(0,a.index-1):act==='next'?Math.min(a.test.questions.length-1,a.index+1):Number(btn.dataset.value);save();return render();}
 if(act==='submit'){if(state.active?.paused){alert('一時停止を解除してから採点してください。');return;}return submit();}
 if(act==='close-result'){state.lastResult=null;save();return render();}
 if(act==='export')return exportData();
 if(act==='import')return $('#import-file')?.click();
 if(act==='reset'){if(!confirm('全学習データを消去します。元に戻せません。事前にJSONバックアップを保存してください。'))return;state=fresh();save();return render();}
 if(act==='gemini')return gemini();
});
function autoPause(){if(state.active&&!state.active.paused){state.active.elapsedBase=elapsed();state.active.paused=true;state.active.startedAt=null;save();}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)autoPause();});
window.addEventListener('pagehide',autoPause);
setInterval(()=>{if(state.active&&!state.active.paused){let el=$('#timer');if(el)el.textContent=`${clock(elapsed())} / ${clock(state.active.test.targetSeconds)}`;}},1000);
render();
})();
</script></body></html>
