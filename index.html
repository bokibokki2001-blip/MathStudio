function startPractice(id){const skill=S.byId[id];if(!skill||statusOf(id)==='locked')return;const categories=['basic','application','word','basic','application','word','basic','application','word'];const questions=categories.map(cat=>E.makeQuestion(skill,cat));state.practice={skillId:id,questions,answers:[],checks:[],index:0,finished:false};state.lastResult=null;save();render();}
function practiceScreen(){const p=state.practice,q=p.questions[p.index],res=p.checks[p.index],cat={basic:'基礎',application:'応用',word:'文章題'}[q.category];
frame(`<div class="page-title"><div><div class="kicker">TRAINING</div><h1>${esc(S.byId[p.skillId].title)} の練習</h1><div class="subtitle">練習中の間違いはマスター判定に影響しません。</div></div><button class="btn secondary small" data-act="stop-practice">練習を終える</button></div><section class="card" style="max-width:800px;margin:auto"><div class="flex between"><span class="tag">${cat}</span><span class="counter">練習 ${p.index+1} / ${p.questions.length}</span></div><div class="question"><p>${esc(q.prompt)}</p></div><div class="field"><label for="practice-answer">${q.inputMode==='formula'?'式を入力（答えだけでは判定できません）':'答え'}</label>${q.inputMode==='formula'?`<textarea id="practice-answer" class="answer-input formula" rows="3" ${res?'disabled':''}>${esc(p.answers[p.index]||'')}</textarea>`:`<input id="practice-answer" class="answer-input" type="text" inputmode="decimal" value="${esc(p.answers[p.index]||'')}" ${res?'disabled':''}>`}</div>${res?`<div class="notice ${res.status==='correct'?'good':'warn'}">${res.status==='correct'?'○ 正解！':res.status==='needs_review'?'△ 要確認':'× もう一度確認しよう'}<br>${esc(res.detail)}<br>確認用の答え：${esc(q.displayAnswer)}</div><p class="hint" style="margin-top:12px">${esc(q.hint)} 練習では答えを確認できます。正式テストでは別の問題が出ます。</p><button class="btn" data-act="practice-next" style="margin-top:16px">${p.index===p.questions.length-1?'練習を終える':'次の練習問題へ →'}</button>`:`<button class="btn" data-act="practice-check">答え合わせ</button>`}</section>`);}
function endPractice(){const p=state.practice;if(!p)return;state.practiceHistory=(state.practiceHistory||[]);state.practiceHistory.push({at:new Date().toISOString(),skillId:p.skillId,questions:p.questions,answers:p.answers,checks:p.checks});state.practice=null;save();render();}
function testScreen(){const a=state.active;if(!a)return;let q=a.test.questions[a.index],cat={basic:'基礎',application:'応用',word:'文章題'}[q.category];let remaining=a.test.targetSeconds-elapsed();frame(`<div class="page-title"><div><div class="kicker">MASTERY EXAM</div><h1>${esc(S.byId[a.test.skillId].title)}</h1><div class="subtitle">各分野を混ぜた1回のテスト。全問正解＋目標時間以内で完全達成。</div></div><div class="flex"><span class="timer" id="timer">${clock(elapsed())} / ${clock(a.test.targetSeconds)}</span><button class="btn secondary small" data-act="pause">${a.paused?'再開':'一時停止'}</button></div></div>${a.paused?'<div class="notice warn">一時停止中です。再開すると解答できます。</div>':''}<section class="card" style="max-width:880px;margin:auto"><div class="flex between"><span class="tag">${cat}</span><span class="counter">問題 ${a.index+1} / ${a.test.questions.length}</span></div><div class="question"><p>${esc(q.prompt)}</p></div><div class="field"><label for="test-answer">${q.inputMode==='formula'?'式を入力（複数行も可）':'答えを入力'}</label>${q.inputMode==='formula'?`<textarea id="test-answer" class="answer-input formula" rows="3" ${a.paused?'disabled':''} placeholder="例：24×3÷8=9\nまたは\n24×3=72\n72÷8=9">${esc(a.answers[a.index]||'')}</textarea>`:`<input id="test-answer" class="answer-input" type="text" inputmode="decimal" autocomplete="off" value="${esc(a.answers[a.index]||'')}" ${a.paused?'disabled':''} placeholder="数値 または 2/3 のような分数">`}</div><div class="hint">${q.inputMode==='formula'?'答えの数値だけでは立式を確認できません。途中式と最終結果を記入してください。':'数字・小数・分数で答えられます。'}</div><div class="qnav">${a.test.questions.map((v,i)=>`<button aria-label="問題${i+1}" data-act="jump" data-value="${i}" class="${i===a.index?'current':a.answers[i]?.trim()?'filled':''}">${i+1}</button>`).join('')}</div><div class="flex between" style="flex-wrap:wrap"><button class="btn secondary" data-act="prev" ${a.index===0?'disabled':''}>← 前の問題</button><div class="flex"><button class="btn secondary" data-act="next" ${a.index===a.test.questions.length-1?'disabled':''}>次の問題 →</button><button class="btn" data-act="submit">採点する</button></div></div><div class="divider"></div><div class="notice warn">マスターには全問正解が必要です。未回答や自動判定できない式は正解として扱いません。目標時間を超えても解答は続けられます。</div></section>`);
}
function submit(){const a=state.active;if(!a)return;const blanks=a.test.questions.filter((_,i)=>!String(a.answers[i]||'').trim()).length;if(blanks&&!confirm(`${blanks}問が未回答です。そのまま採点しますか？`))return;
 if(!a.paused){a.elapsedBase=elapsed();a.paused=true;a.startedAt=null;}
 const result=E.gradeTest(a.test,a.answers,a.elapsedBase),rec=E.applyResult(state.records,a.test.skillId,result,a.elapsedBase,a.test.createdAt);
 const row={at:new Date().toISOString(),skillId:a.test.skillId,test:a.test,answers:a.answers,results:result.results,metrics:result.metrics,elapsedSeconds:a.elapsedBase,perfect:result.perfect,provisional:result.provisional,correct:result.correct,count:result.count};
 state.attemptsHistory.push(row);state.lastResult={...row,recMaster:rec.master};state.active=null;state.selectedId=row.skillId;state.nav='tree';save();render();}
function resultScreen(){const r=state.lastResult;if(!r)return tree();const s=S.byId[r.skillId],st=statusOf(r.skillId),target=r.test.targetSeconds;
 const desc=r.perfect?st==='master'?'完全マスター！4つの宝石が合体しました。':'全問正解・時間達成！前提技能の完全マスター待ちです。':r.provisional?'全4項目が75%以上。次の技能に挑戦できます。':'まだ仮免には届いていません。間違えたところを確かめましょう。';
 frame(`<div class="page-title"><div><div class="kicker">EXAM RESULT</div><h1>${esc(s.title)} ― 採点結果</h1></div><button class="btn secondary" data-act="close-result">スキルツリーに戻る</button></div><div class="grid2"><section class="card"><h2>${r.perfect?'🏆 挑戦成功！':r.provisional?'🔓 仮免到達！':'📝 次の挑戦に備えよう'}</h2><p>${desc}</p><div class="statgrid"><div class="stat"><strong>${r.correct}/${r.count}</strong><small>正解数</small></div><div class="stat"><strong>${clock(r.elapsedSeconds)}</strong><small>実際の時間</small></div><div class="stat"><strong>${clock(target)}</strong><small>目標時間</small></div></div><div class="divider"></div>${metrics.map(([k,label,col])=>`<div class="metricrow"><b>${label}</b><div class="progress"><div style="width:${r.metrics[k]}%;background:${col}"></div></div><b>${r.metrics[k]}%</b></div>`).join('')}<div class="notice" style="margin-top:12px">基本・応用・文章題はそれぞれの正答率。速度は目標時間と実時間だけで評価します。完全マスターには全問正解＋時間内の両方が必要です。</div><div class="flex" style="margin-top:18px;flex-wrap:wrap"><button class="btn" data-act="retry" data-id="${r.skillId}">新しい問題で再挑戦</button><button class="btn secondary" data-act="gemini">Geminiへの質問を用意</button></div></section><section class="card"><h2>解答の振り返り</h2><p class="muted">今回の問題・あなたの解答・判定を記録しています。</p><div style="max-height:590px;overflow:auto">${r.test.questions.map((q,i)=>{let res=r.results[i],good=res.status==='correct';return `<div class="result-line ${good?'ok':res.status==='needs_review'?'review':'bad'}"><div class="flex between"><b>${i+1}. ${good?'○ 正解':res.status==='needs_review'?'△ 要確認':'× 不正解'}</b><span class="tag">${{basic:'基礎',application:'応用',word:'文章題'}[q.category]}</span></div><div class="result-prompt">${esc(q.prompt)}</div><div class="result-detail">解答：${esc(r.answers[i]||'（未回答）').replace(/\n/g,' / ')}<br>確認用の答え：${esc(q.displayAnswer)}<br>${esc(res.detail)}</div></div>`;}).join('')}</div></section></div>`);
}
function progress(){const sum=summary(),hist=state.attemptsHistory;const W=700,H=230,pad=38,maxY=15;
 const shadow={};
 const counts=hist.map((h,i)=>{
   if(!shadow[h.skillId])shadow[h.skillId]={};
   if(h.provisional)shadow[h.skillId].license=true;
   if(h.perfect){shadow[h.skillId].selfMaster=true;shadow[h.skillId].license=true;}
   E.recalc(shadow);
   return {a:i+1,b:S.skills.filter(sk=>shadow[sk.id]?.license).length,c:S.skills.filter(sk=>shadow[sk.id]?.master).length};
 });
 const point=(name)=>counts.map((o,i)=>`${pad+(i/Math.max(1,counts.length-1))*(W-2*pad)},${H-pad-o[name]/maxY*(H-2*pad)}`).join(' ');
 frame(`<div class="page-title"><div><div class="kicker">LEARNING HISTORY</div><h1>学習の記録</h1></div></div>${navBar()}<div class="grid2"><section class="card"><h2>試作版の学習推移</h2>${hist.length?`<svg class="history-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="受験回数ごとの仮免技能数とマスター技能数"><line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#cdd8e7"/><line x1="${pad}" y1="${pad}" x2="${pad}" y2="${H-pad}" stroke="#cdd8e7"/><polyline fill="none" stroke="#4a74ce" stroke-width="3" points="${point('b')}"/><polyline fill="none" stroke="#19a279" stroke-width="3" points="${point('c')}"/><text x="${pad}" y="20" font-size="13" fill="#677b99">技能数 0〜15</text></svg><div class="flex" style="flex-wrap:wrap"><span class="pill">🔵 仮免を獲得した技能</span><span class="pill">🟢 現在MASTERの技能</span></div>`:'<div class="notice">受験履歴がありません。混合テストを受けると記録されます。</div>'}<div class="notice warn" style="margin-top:16px">学校の標準進度比較・将来予測は未実装です。公的な月別進度や難易度の校正後に追加します。</div></section><section class="card"><h2>記録の概要</h2><div class="statgrid"><div class="stat"><strong>${sum.master}</strong><small>MASTER</small></div><div class="stat"><strong>${sum.licenses}</strong><small>仮免</small></div><div class="stat"><strong>${sum.attempts}</strong><small>正式テスト</small></div></div><div class="divider"></div><h3>最近の受験</h3>${hist.slice(-10).reverse().map(h=>`<div class="result-line"><div class="flex between"><b>${esc(S.byId[h.skillId]?.title||'技能')}</b><span class="status ${h.perfect?'master':h.provisional?'licensed':''}">${h.perfect?'満点':h.provisional?'仮免':'練習継続'}</span></div><div class="hint">${esc(h.at.slice(0,16).replace('T',' '))} / ${h.correct}/${h.count} 正解 / ${clock(h.elapsedSeconds)}</div></div>`).join('')||'<p class="muted">記録なし</p>'}</section></div>`);
}
function settings(){frame(`<div class="page-title"><div><div class="kicker">SETTINGS</div><h1>設定・バックアップ</h1></div></div>${navBar()}<div class="grid2"><section class="card"><h2>学習データの保存</h2><p>名前やアカウントを使わず、このブラウザ内に保存します。学校の端末では消去される場合があるため、こまめにJSONファイルを書き出してください。</p><div class="stack"><button class="btn" data-act="export">JSONバックアップを保存</button><button class="btn secondary" data-act="import">JSONバックアップを読み込む</button><input type="file" id="import-file" accept=".json,application/json" style="display:none"><button class="btn secondary" data-act="diagnosis">初回診断をやり直す</button></div><p class="smallnote">JSONに問題文・解答・正誤・所要時間が保存されます。共有する前に内容を確認してください。</p></section><section class="card"><h2>現在の対象範囲</h2><p>問題生成・採点できるのは小学1〜4年の一部15技能です。参考データとして小学校〜高校の285技能案をZIPに同梱していますが、アプリ本体には未接続です。</p><div class="notice warn">文章題の数式判定は四則演算中心の限定実装です。数値が合っていても式を検証できなければ「要確認」となり、マスターにはなりません。</div><div class="divider"></div><button class="btn danger small" data-act="reset">端末内の学習データを初期化</button></section></div>`);}
function render(){if(!state.profile)return onboard();if(state.active)return testScreen();if(state.practice)return practiceScreen();if(state.diagnosis)return diagnose();if(state.lastResult)return resultScreen();if(state.nav==='progress')return progress();if(state.nav==='settings')return settings();tree();}
function changePage(page){state.nav=page;state.lastResult=null;state.active=null;state.practice=null;state.diagnosis=null;save();render();}
function exportData(){const payload={...state,exportedAt:new Date().toISOString()};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});const link=document.createElement('a');const url=URL.createObjectURL(blob);link.href=url;link.download=`MathStudio_backup_${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);}
function sanitizeImport(data){if(!data||data.schema_version!==1||typeof data.profile!=='object'||!data.profile)throw Error('非対応のバックアップ形式です');const out=fresh();const grade=Number(data.profile.grade),month=Number(data.profile.month);if(!(grade>=1&&grade<=6&&month>=1&&month<=12))throw Error('学年・月のデータが不正です');out.profile={grade,month};if(data.records&&typeof data.records==='object'){for(const sk of S.skills){const rec=data.records[sk.id];if(rec&&typeof rec==='object'){out.records[sk.id]={license:rec.license===true,selfMaster:rec.selfMaster===true,metrics:Object.fromEntries(metrics.map(([k])=>[k,Math.min(100,Math.max(0,Number(rec.metrics?.[k])||0))])),attempts:Math.min(100000,Math.max(0,Number(rec.attempts)||0)),history:Array.isArray(rec.history)?rec.history.slice(-2000):[]};}}}out.recommendations=Array.isArray(data.recommendations)?data.recommendations.filter(id=>!!S.byId[id]):[];out.selectedId=S.byId[data.selectedId]?data.selectedId:null;
 out.attemptsHistory=Array.isArray(data.attemptsHistory)?data.attemptsHistory.slice(0,10000).filter(x=>S.byId[x?.skillId]&&Array.isArray(x.test?.questions)&&Array.isArray(x.answers)&&Array.isArray(x.results)):[];out.practiceHistory=Array.isArray(data.practiceHistory)?data.practiceHistory.filter(x=>S.byId[x?.skillId]&&Array.isArray(x.questions)&&Array.isArray(x.answers)):[];
 out.lastDiagnosis=data.lastDiagnosis&&typeof data.lastDiagnosis==='object'?data.lastDiagnosis:null;E.repairStoredGrades(out);out.gradingRevision=2;E.recalc(out.records);return out;}
async function importData(f){if(!f||f.size>8*1024*1024){alert('8MB以下のJSONファイルを選んでください');return;}try{const obj=JSON.parse(await f.text());const imported=sanitizeImport(obj);if(!confirm('端末内の学習記録を、このバックアップで置き換えます。よろしいですか？'))return;state=imported;save();render();}catch(e){alert('読み込み失敗：'+e.message);}}
function gemini(){const r=state.lastResult;if(!r)return;const misses=r.test.questions.map((q,i)=>({q,res:r.results[i],answer:r.answers[i]})).filter(x=>x.res.status!=='correct').slice(0,3);const prompt=`小学生の算数の家庭教師として、答えをすぐ教えず質問を1つずつ出して考え方を導いてください。氏名等の個人情報はありません。\n単元：${S.byId[r.skillId]?.title}\n${misses.length?misses.map(x=>`問題：${x.q.prompt}\n子どもの解答：${x.answer||'（無回答）'}\n判定：${x.res.detail}`).join('\n'): '満点でした。関連する発展問題を1つだけ作り、段階的にヒントをください。'}`;
 const opened=window.open('https://gemini.google.com/app','_blank','noopener,noreferrer');
 if(navigator.clipboard?.writeText)navigator.clipboard.writeText(prompt).then(()=>{alert('質問文をコピーしました。Geminiの画面に貼り付けてください。');}).catch(()=>fallbackCopy(prompt));else fallbackCopy(prompt);
 if(!opened)alert('Geminiの別タブを開けませんでした。ブラウザで gemini.google.com/app を開いてください。');}
function fallbackCopy(t){let el=document.createElement('textarea');el.value=t;el.style.position='fixed';el.style.top='0';document.body.appendChild(el);el.select();try{document.execCommand('copy');alert('質問文をコピーしました。Geminiに貼り付けてください。');}catch{alert('コピーできませんでした。');}el.remove();}
// Event delegation; active text inputs are saved on every keystroke.
document.addEventListener('input',e=>{if(e.target.id==='test-answer'&&state.active){state.active.answers[state.active.index]=e.target.value;save();}if(e.target.id==='practice-answer'&&state.practice){state.practice.answers[state.practice.index]=e.target.value;save();}});
document.addEventListener('change',e=>{if(e.target.id==='import-file')importData(e.target.files?.[0]);});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='diag-answer'){e.preventDefault();$('#app [data-act="diagnose-answer"]')?.click();}});
document.addEventListener('click',e=>{const btn=e.target.closest('[data-act]');if(!btn||btn.disabled)return;const act=btn.dataset.act,id=btn.dataset.id;
 if(act==='begin'){state=fresh();state.profile={grade:Number($('#grade').value),month:Number($('#month').value)};state.diagnosis=E.makeDiagnosis(state.profile);save();return render();}
 if(act==='nav')return changePage(btn.dataset.value);
 if(act==='map-focus')return window.MathTechTree.focus(state.selectedId||state.recommendations[0]||S.skills[0].id);
 if(act==='map-zoom-in')return window.MathTechTree.adjustZoom(.1,state.selectedId||state.recommendations[0]||S.skills[0].id);
 if(act==='map-zoom-out')return window.MathTechTree.adjustZoom(-.1,state.selectedId||state.recommendations[0]||S.skills[0].id);
 if(act==='select'){state.selectedId=id;save();return tree();}
 if(act==='test'||act==='retry')return startTest(id);
 if(act==='practice')return startPractice(id);
 if(act==='stop-practice')return endPractice();
 if(act==='practice-check'){const p=state.practice;if(!p)return;const answer=p.answers[p.index]||'';p.checks[p.index]=E.scoreAnswer(p.questions[p.index],answer);save();return render();}
 if(act==='practice-next'){const p=state.practice;if(!p)return;if(p.index===p.questions.length-1)return endPractice();p.index++;save();return render();}
 if(act==='diagnosis'){if(!confirm('初回診断を最初からやり直します。取得済みの宝石は保持します。よろしいですか？'))return;state.lastResult=null;state.active=null;state.practice=null;state.diagnosis=E.makeDiagnosis(state.profile);save();return render();}
 if(act==='diagnose-answer'){let ans=$('#diag-answer')?.value?.trim();if(!ans){alert('答えを入力してください');return;}const step=E.diagnoseAnswer(state.diagnosis,ans);save();return step.done?finishDiagnosis():render();}
 if(act==='pause'){let a=state.active;if(a.paused){a.paused=false;a.startedAt=ms();}else{a.elapsedBase=elapsed();a.paused=true;a.startedAt=null;}save();return render();}
 if(act==='prev'||act==='next'||act==='jump'){let a=state.active;if(!a)return;a.index=act==='prev'?Math.max(0,a.index-1):act==='next'?Math.min(a.test.questions.length-1,a.index+1):Number(btn.dataset.value);save();return render();}
 if(act==='submit'){if(state.active?.paused){alert('一時停止を解除してから採点してください。');return;}return submit();}
 if(act==='close-result'){state.lastResult=null;save();return render();}
 if(act==='export')return exportData();
 if(act==='import')return $('#import-file')?.click();
 if(act==='reset'){if(!confirm('全学習データを消去します。元に戻せません。事前にJSONバックアップを保存してください。'))return;state=fresh();save();return render();}
 if(act==='gemini')return gemini();
});
function autoPause(){if(state.active&&!state.active.paused){state.active.elapsedBase=elapsed();state.active.paused=true;state.active.startedAt=null;save();}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)autoPause();});
window.addEventListener('pagehide',autoPause);
setInterval(()=>{if(state.active&&!state.active.paused){let el=$('#timer');if(el)el.textContent=`${clock(elapsed())} / ${clock(state.active.test.targetSeconds)}`;}},1000);
render();
})();
</script></body></html>
